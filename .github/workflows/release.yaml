---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Draft release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Dekart tag to release, e.g. v0.27.0"
        type: string
        required: true
      patch:
        description: "Our patch number. Bump it to re-release the same Dekart tag."
        type: string
        required: false
        default: "0"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    name: Check the series
    runs-on: ubuntu-latest

    # Env vars, never `${{ }}` inside a run block: an input expanded into a script can close the
    # quote and run.
    env:
      TAG: ${{ inputs.version }}
      PATCH: ${{ inputs.patch || '0' }}

    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Strip v from the tag
        id: dekart
        run: echo "tag=v${TAG#v}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false

      # quilt is in neither the mise registry nor the pkgx pantry; apt is the only source for it.
      - uses: awalsh128/cache-apt-pkgs-action@553a35bb8ebd9fcabcb1c9451aa4c98e1b4ca8a9 # v1.6.3
        with:
          packages: quilt
          version: 1.0

      # Before anything that sources .mise/lib.sh: it shells out to jq.
      - uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3

      # Version comes from package.json, not `git describe`: actions/checkout fetches submodules
      # shallow and without tags.
      - name: Check the submodule is on the version being released
        env:
          DEKART_TAG: ${{ steps.dekart.outputs.tag }}
        run: |
          source ./.mise/lib.sh
          pinned="v$(dekart_version)"
          if [[ "$pinned" != "$DEKART_TAG" ]]; then
            echo "lib/dekart is on $pinned but the release says $DEKART_TAG"
            exit 1
          fi

      - name: Set our version
        id: version
        run: |
          source ./.mise/lib.sh
          echo "version=$(geoart_version "$PATCH")" >> "$GITHUB_OUTPUT"

      # No `quilt push -a` ahead of it: test:series pops and pushes the series itself.
      - run: mise run test:series

  image:
    name: Image
    needs: check
    uses: ./.github/workflows/image.yaml
    permissions:
      attestations: write
      contents: write
      id-token: write
      packages: write
    with:
      release: true
      patch: ${{ inputs.patch || '0' }}

  release:
    name: Draft the release
    runs-on: ubuntu-latest
    needs: [check, image]

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Everything between "## Unreleased" and the next "## ", trailing blank lines stripped, then
      # the image the release published.
      - name: Write the release notes
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/geoart
          VERSION: ${{ needs.check.outputs.version }}
          DIGEST: ${{ needs.image.outputs.digest }}
        run: |
          mkdir -p .cache
          awk '/^## Unreleased/ {f=1; next} /^## / {f=0} f' CHANGELOG.md \
            | sed -e '/./,$!d' -e ':a' -e '/^\n*$/{$d;N;ba' -e '}' > .cache/release-notes
          printf '\n## Image\n\n    %s:%s@%s\n' "$IMAGE" "$VERSION" "$DIGEST" >> .cache/release-notes
          cat .cache/release-notes

      # A human publishes the draft.
      - uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2 # zizmor: ignore[superfluous-actions]
        with:
          draft: true
          tag_name: v${{ needs.check.outputs.version }}
          name: v${{ needs.check.outputs.version }}
          body_path: .cache/release-notes
