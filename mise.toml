# quilt is absent on purpose — in neither the mise registry nor the pkgx pantry.
# `pacman -S quilt` / `brew install quilt` / `apt-get install quilt`.
min_version = "2026.7.12"

[settings]
lockfile = true

# Owned by flint: `flint run --fix flint-setup` rewrites this table. A linter is
# activated by its mise registry SHORT name.
[tools]
bats = "1.14.0"
container-structure-test = "1.22.1"
# Upstream's toolchain: go.mod and the Dockerfile's node stage.
go = "1.25.0"
hk = "1.53.0"
jq = "1.8.2"
node = "18.20.8"
pkl = "0.32.1"

# Linters
actionlint = "1.7.12"
"aqua:grafana/flint" = "0.22.15"
"aqua:owenlamont/ryl" = "0.21.0"
biome = "2.6.4"
hadolint = "2.14.0"
rumdl = "0.2.43"
shellcheck = "0.11.0"
shfmt = "3.13.1"
taplo = "0.10.0"
zizmor = "1.32.0"

[env]
HK_MISE = 1 # run hk steps through `mise x`
# Pins quilt's diff prefix to a/ b/. Without it the bytes quilt writes carry
# basename $PWD, and no directory name leaves both this tree and CI green.
QUILTRC = "{{config_root}}/.quiltrc"

[hooks]
enter = ["mise install"]
postinstall = "hk install --mise"

# Leaf tasks are scripts under .mise/tasks/, auto-discovered. Only the DAGs live here.

[tasks.lint]
description = "Every generic file type — shell, markdown, yaml, toml, Dockerfile, workflows"
run = "flint run --full"

[tasks."check:gates"]
description = "The gates that only read the tree — safe in parallel"
depends = ["lint"]

[tasks.check]
description = "Everything that gates a push"
# test:series mutates the tree the other gates read, so it runs alone first.
run = ["mise run test:series", "mise run up", "mise run check:gates"]

[tasks.ci]
description = "The full local pipeline: gates, then the image"
depends = ["check"]
run = "mise run build"
